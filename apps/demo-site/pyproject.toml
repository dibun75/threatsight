[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threatsight-demo-site"
version = "2.0.0.dev0"
description = "Synthetic public site for ThreatSight M5 AI discovery demos"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "starlette==1.3.1",
  "uvicorn[standard]==0.34.3",
]

[tool.setuptools.packages.find]
where = ["src"]
