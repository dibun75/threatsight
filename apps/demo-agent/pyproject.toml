[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threatsight-demo-agent"
version = "2.0.0.dev0"
description = "Synthetic order-support agent for ThreatSight CTRL-002 demos"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "starlette==1.3.1",
  "uvicorn[standard]==0.34.3",
  "pydantic==2.11.7",
]

[tool.setuptools.packages.find]
where = ["src"]
