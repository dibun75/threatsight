[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threatsight-api"
version = "2.0.0.dev0"
description = "ThreatSight 2 API — AI assurance platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "starlette==1.3.1",
  "uvicorn[standard]==0.34.3",
  "pydantic==2.11.7",
  "pydantic-settings==2.8.1",
  "structlog==25.2.0",
  "sqlalchemy==2.0.41",
  "psycopg[binary]==3.2.9",
  "alembic==1.15.2",
  "python-multipart==0.0.31",
  "pypdf==6.21.4",
  "python-docx==1.1.2",
  "defusedxml==0.7.1",
  "cryptography==50.0.0",
  "argon2-cffi==23.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
