# Hardened pilot Compose profile (Phase 3F).
# Not a commercial production / HA / SLA claim.
#
# Usage (isolated project name — do not collide with live reference):
#   docker compose -p threatsight-pilot -f deploy/compose/hardened/docker-compose.yml up -d
#
# Requires: customer TLS reverse proxy in front of web; OIDC; file-based secrets.

name: threatsight-pilot

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: threatsight
    secrets:
      - postgres_user
      - postgres_password
    volumes:
      - threatsight_pilot_pg:/var/lib/postgresql/data
    # No host port publication by default.
    ports: []
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$$( [ -f /run/secrets/postgres_user ] && cat /run/secrets/postgres_user || echo $${POSTGRES_USER:-threatsight} )\" -d threatsight",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [internal]

  migrate:
    image: ${THREATSIGHT_API_IMAGE:-threatsight-api:837e39a}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    env_file: [.env]
    environment:
      THREATSIGHT_ENV: production
      THREATSIGHT_DEPLOYMENT_PROFILE: pilot-compose
      THREATSIGHT_DATABASE_URL_FILE: /run/secrets/database_url
      THREATSIGHT_RUN_MIGRATIONS: "false"
    secrets:
      - database_url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [internal]

  api:
    image: ${THREATSIGHT_API_IMAGE:-threatsight-api:837e39a}
    env_file: [.env]
    environment:
      THREATSIGHT_ENV: production
      THREATSIGHT_DEPLOYMENT_PROFILE: pilot-compose
      THREATSIGHT_AUTH_MODE: oidc
      THREATSIGHT_PUBLIC_DEMO: "false"
      THREATSIGHT_OPENAPI_ENABLED: "false"
      THREATSIGHT_ALLOW_SYNTHETIC_LOADERS: "false"
      THREATSIGHT_DATABASE_URL_FILE: /run/secrets/database_url
      THREATSIGHT_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      THREATSIGHT_RUN_MIGRATIONS: "false"
    secrets:
      - database_url
      - oidc_client_secret
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Localhost-only administrative binding example (proxy terminates TLS).
    ports:
      - "127.0.0.1:${THREATSIGHT_API_HOST_PORT:-18080}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    networks: [internal]

  web:
    image: ${THREATSIGHT_WEB_IMAGE:-threatsight-web:837e39a}
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${THREATSIGHT_WEB_HOST_PORT:-13000}:3000"
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    networks: [internal]

  intel-worker:
    image: ${THREATSIGHT_API_IMAGE:-threatsight-api:837e39a}
    command: ["python", "-m", "threatsight_api.intel"]
    env_file: [.env]
    environment:
      THREATSIGHT_ENV: production
      THREATSIGHT_DEPLOYMENT_PROFILE: pilot-compose
      THREATSIGHT_DATABASE_URL_FILE: /run/secrets/database_url
      THREATSIGHT_RADAR_TOKEN_FILE: /run/secrets/cloudflare_radar_token
      THREATSIGHT_VULNCHECK_TOKEN_FILE: /run/secrets/vulncheck_token
      THREATSIGHT_ALLOW_SYNTHETIC_LOADERS: "false"
    secrets:
      - database_url
      - cloudflare_radar_token
      - vulncheck_token
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    networks: [internal]

  evidence-signer:
    image: ${THREATSIGHT_API_IMAGE:-threatsight-api:837e39a}
    command: ["python", "-m", "threatsight_api.evidence_signer"]
    env_file: [.env]
    environment:
      THREATSIGHT_ENV: production
      THREATSIGHT_DEPLOYMENT_PROFILE: pilot-compose
      THREATSIGHT_DATABASE_URL_FILE: /run/secrets/database_url
      THREATSIGHT_EVIDENCE_SIGNING_KEY_FILE: /run/secrets/evidence_signing_key
    secrets:
      - database_url
      - evidence_signing_key
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    networks: [internal]

secrets:
  postgres_user:
    file: ./secrets/postgres_user
  postgres_password:
    file: ./secrets/postgres_password
  database_url:
    file: ./secrets/database_url
  oidc_client_secret:
    file: ./secrets/oidc_client_secret
  cloudflare_radar_token:
    file: ./secrets/cloudflare_radar_token
  vulncheck_token:
    file: ./secrets/vulncheck_token
  evidence_signing_key:
    file: ./secrets/evidence_signing_key

volumes:
  threatsight_pilot_pg:

networks:
  internal:
    driver: bridge
    internal: false
