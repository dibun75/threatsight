apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "threatsight.fullname" . }}-web
  labels:
    {{- include "threatsight.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "threatsight.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "threatsight.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
      annotations:
        checksum/config: {{ include "threatsight.configChecksum" . }}
    spec:
      serviceAccountName: {{ include "threatsight.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: web
          image: {{ include "threatsight.image" (list .Values.image.web.repository .Values.image.web.tag .Values.image.web.digest) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.service.port }}
          env:
            - name: API_INTERNAL_URL
              value: {{ printf "http://%s-api:%v" (include "threatsight.fullname" .) .Values.api.service.port | quote }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.web.readiness.path }}
              port: {{ .Values.probes.web.readiness.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.web.liveness.path }}
              port: {{ .Values.probes.web.liveness.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "threatsight.fullname" . }}-web
  labels:
    {{- include "threatsight.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    {{- include "threatsight.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
