{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "threatsight.fullname" . }}-default-deny
  labels:
    {{- include "threatsight.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "threatsight.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "threatsight.fullname" . }}-web
  labels:
    {{- include "threatsight.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "threatsight.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.web.service.port }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "threatsight.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: {{ .Values.api.service.port }}
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "threatsight.fullname" . }}-api
  labels:
    {{- include "threatsight.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "threatsight.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "threatsight.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: web
      ports:
        - protocol: TCP
          port: {{ .Values.api.service.port }}
  egress:
    - ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 443
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "threatsight.fullname" . }}-workers
  labels:
    {{- include "threatsight.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [intel-worker, evidence-signer, migrate]
      - key: app.kubernetes.io/instance
        operator: In
        values: [{{ .Release.Name | quote }}]
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 443
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
