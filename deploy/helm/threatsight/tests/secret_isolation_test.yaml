# helm-unittest style documentation cases (executed via scripts/helm_template_guard.sh).
# Ensures rendered manifests never embed secret values from values.yaml mistakes.
suite: secret isolation
templates:
  - templates/*.yaml
tests:
  - it: does not embed placeholder client secrets
    asserts:
      - notMatchRegex:
          path: data
          pattern: "client-secret-value|BEGIN PRIVATE KEY|changeme"
